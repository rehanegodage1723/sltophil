<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Our Future Trip — Colombo ✈️ Cebu ❤️ Manila</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#eaf8ff,#fff5f8);color:#24384d}
button{font:inherit}
#app{min-height:100vh;display:flex;justify-content:center}
.game{width:min(960px,100%);min-height:100vh;background:#ffffffcc;overflow:hidden;box-shadow:0 0 35px #52748b20}
header{padding:16px;background:linear-gradient(135deg,#fff0f5,#eaf7ff);text-align:center;border-bottom:1px solid #dcecf4}
header h1{margin:0;color:#e4507b;font-size:clamp(23px,5vw,34px)}
header p{margin:5px 0 0;color:#6b7c8d;font-size:13px}
.hud{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px}
.badge{background:#fff;border:1px solid #e3edf3;border-radius:20px;padding:7px 12px;font-size:12px;box-shadow:0 3px 10px #456b7a12}
.progress{height:8px;background:#e8eef2}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#ff6b98,#58afea);transition:.4s}
main{padding:18px 14px 35px}
.screen{animation:appear .35s ease}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{text-align:center;margin:6px 0 8px;font-size:25px;color:#344d65}
.story{text-align:center;max-width:720px;margin:0 auto 15px;line-height:1.55;color:#65788a}
.center{text-align:center}.btn{border:0;border-radius:16px;padding:12px 18px;background:linear-gradient(135deg,#ff6797,#e84d7a);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 8px 18px #df517533}.btn:disabled{opacity:.4}

/* packing */
.suitcase{width:min(390px,100%);margin:10px auto;background:#a86e49;border-radius:22px;padding:14px;box-shadow:0 10px 22px #5b3a2525}
.handle{width:80px;height:24px;border:5px solid #71472f;border-bottom:0;border-radius:14px 14px 0 0;margin:auto}
.inside{min-height:210px;background:#d39a70;border:5px solid #71472f;border-radius:15px;padding:12px;display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.luggage-item{width:65px;height:65px;border:0;border-radius:15px;background:white;font-size:31px;cursor:pointer;box-shadow:0 4px 9px #3b261b25}.luggage-item.done{opacity:.3;transform:scale(.9)}
.note{max-width:650px;margin:12px auto;background:#fff7fb;border:2px solid #ffd5e3;padding:11px;border-radius:15px;text-align:center;color:#73586a;font-size:13px}

/* accurate geographic game */
.map-wrap{max-width:900px;margin:auto}
.map{position:relative;width:100%;aspect-ratio:1.8;border-radius:24px;overflow:hidden;border:4px solid white;box-shadow:0 10px 30px #456b7a24;background:#aee2f2}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.route{fill:none;stroke:#fff;stroke-width:2.8;stroke-dasharray:8 7;stroke-linecap:round;filter:drop-shadow(0 2px 2px #466b77)}
.routeDone{stroke:#ff668f;stroke-width:3.5;stroke-dasharray:0}
.airport{position:absolute;transform:translate(-50%,-50%);z-index:5;text-align:center;white-space:nowrap}
.dot{width:17px;height:17px;background:#fff;border:5px solid #e9507d;border-radius:50%;margin:auto;box-shadow:0 2px 8px #34515e55}
.airport.blue .dot{border-color:#338fd2}
.airport span{display:block;background:#fff;padding:4px 7px;border-radius:9px;font-size:11px;font-weight:800;margin-top:4px;box-shadow:0 2px 8px #31566b30}
.plane{position:absolute;z-index:10;font-size:42px;cursor:grab;touch-action:none;user-select:none;transform:translate(-50%,-50%) rotate(0deg);filter:drop-shadow(0 5px 4px #27495a44)}
.plane:active{cursor:grabbing}
.route-label{position:absolute;z-index:4;background:#ffffffdd;padding:5px 8px;border-radius:10px;font-size:11px;font-weight:800;color:#536a7b;box-shadow:0 2px 7px #31566b22}
.info-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0}
.info{background:#fff;border-radius:13px;padding:8px 11px;font-size:12px;box-shadow:0 3px 10px #456b7a18}

/* airport */
.airport-scene{position:relative;height:360px;max-width:820px;margin:15px auto;border-radius:26px;overflow:hidden;border:4px solid white;background:linear-gradient(#9dddf8 0 52%,#79ba70 52%)}
.airport-scene:after{content:"";position:absolute;left:-5%;right:-5%;bottom:62px;height:105px;background:#555;transform:rotate(-1deg)}
.terminal{position:absolute;z-index:3;left:7%;bottom:112px;width:200px;height:120px;background:#f9fcff;border-radius:17px 17px 4px 4px;box-shadow:0 8px 15px #31556833}
.terminal b{display:block;text-align:center;color:#47667b;font-size:12px;padding:16px 5px}.windows{font-size:25px;text-align:center;color:#8cc1d5}
.stripe{position:absolute;z-index:4;left:0;right:0;bottom:105px;border-top:6px dashed white}
.person{position:absolute;z-index:8;font-size:68px;bottom:105px;transition:1.1s ease}
#me{left:28%}#angel{right:22%}
.heart{position:absolute;z-index:9;font-size:27px;cursor:pointer;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-15px) scale(1.12)}}

/* finale */
.card{max-width:700px;margin:20px auto;padding:28px 20px;text-align:center;border-radius:28px;background:linear-gradient(145deg,#fff,#fff1f6);border:2px solid #ffd2e0;box-shadow:0 15px 35px #506f8120}
.big{font-size:75px}.card h3{font-size:28px;color:#e44e78;margin:5px}.ticket{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:18px}.ticket div{padding:9px 12px;background:#edf8ff;border-radius:12px;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div id="app"><div class="game">
<header><h1>✈️ Our Future Trip to Cebu ❤️</h1><p>Rehan 🇱🇰 → Cebu 🌴 ← 🇵🇭 Angel</p></header>
<div class="hud"><div class="badge">💗 Love <b id="love">0</b></div><div class="badge">🎯 Mission <b id="mission">1</b>/6</div><div class="badge">🧳 Packed <b id="packed">0</b>/5</div></div>
<div class="progress"><div id="progress"></div></div>
<main id="main"></main>
</div></div>

<script>
const main=document.getElementById('main');
let love=0, packed=0;
function hud(m){document.getElementById('mission').textContent=m;document.getElementById('packed').textContent=packed;document.getElementById('love').textContent=love;document.getElementById('progress').style.width=((m-1)/5*100)+'%'}
function screen(x){main.innerHTML=x;main.firstElementChild.classList.add('screen')}
function addLove(n){love+=n;document.getElementById('love').textContent=love}

function packing(){
hud(1);packed=0;document.getElementById('packed').textContent=0;
screen(`<section><h2>🧳 First: Pack for the journey</h2><p class="story">You are getting ready in Sri Lanka. Pack five important things before your flight to Cebu.</p>
<div class="suitcase"><div class="handle"></div><div class="inside" id="bag"></div></div>
<div class="center" id="items"></div>
<div class="note" id="packnote">Choose: 👕 clothes · 📱 phone · 📷 camera · 💌 love letter · 🧸 Angel's gift</div></section>`);
const data=[['👕','Clothes'],['📱','Phone'],['📷','Camera'],['💌','Love letter'],['🧸','Angel’s gift'],['🎮','Game'],['🍕','Snack']];
const items=document.getElementById('items');
data.forEach((d,i)=>{let b=document.createElement('button');b.className='luggage-item';b.textContent=d[0];b.title=d[1];b.onclick=()=>{if(b.classList.contains('done'))return;if(i<5){b.classList.add('done');packed++;addLove(2);document.getElementById('packed').textContent=packed;document.getElementById('packnote').textContent=packed<5?`${d[1]} packed! ${5-packed} more to go. ❤️`:'Everything is packed! Colombo airport is waiting. ✈️';if(packed===5)setTimeout(colombo,700)}else document.getElementById('packnote').textContent='Cute, but save that one for later 😄';};items.appendChild(b)});
}

function mapHTML(){
return `<div class="map" id="map">
<svg viewBox="0 0 1000 555" preserveAspectRatio="none" aria-label="Schematic geographic map of Sri Lanka and the Philippines">
<defs><pattern id="waves" width="70" height="45" patternUnits="userSpaceOnUse"><path d="M0 20 Q18 10 36 20 T72 20" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="2"/></pattern></defs>
<rect width="1000" height="555" fill="url(#waves)"/>
<!-- Sri Lanka, Philippines and nearby islands are schematic silhouettes placed geographically -->
<path d="M205 300 C180 275 174 235 191 204 C208 174 239 165 256 193 C274 222 268 263 250 294 C234 321 217 326 205 300Z" fill="#68ae78" stroke="#4f8e61" stroke-width="3"/>
<path d="M650 75 L680 90 675 120 695 145 680 175 700 205 683 235 705 262 690 295 715 330 698 365 720 400 700 438 665 430 642 395 650 360 630 325 644 292 625 260 642 228 628 195 648 165 630 130Z" fill="#70b47d" stroke="#4f9164" stroke-width="3"/>
<path d="M770 185 L795 202 792 230 810 245 795 270 815 290 802 315 820 335 805 365 775 350 764 320 775 295 755 270 765 240 750 215Z" fill="#70b47d" stroke="#4f9164" stroke-width="3"/>
<path d="M585 245 L605 255 598 280 580 288 570 270Z" fill="#70b47d"/>
<path d="M730 400 L755 410 748 435 725 442 715 420Z" fill="#70b47d"/>
</svg>
<div class="airport blue" style="left:21%;top:52%"><div class="dot"></div><span>🇱🇰 Colombo (CMB)</span></div>
<div class="airport" style="left:69%;top:28%"><div class="dot"></div><span>🇵🇭 Manila (MNL)</span></div>
<div class="airport" style="left:78%;top:72%"><div class="dot"></div><span>🌴 Cebu (CEB)</span></div>
</div>`;
}

/* Geographic coordinates used for the game route:
Colombo 6.9271N,79.8612E
Manila 14.5995N,120.9842E
Cebu 10.3157N,123.8854E
The map is a visual game map; routes follow those real-world city positions. */
function colombo(){
hud(2);
screen(`<section><h2>🇱🇰 Colombo → Cebu 🇵🇭</h2>
<p class="story">Your journey begins in Colombo. Drag <b>your plane</b> along the white route until it reaches <b>Cebu International Airport (CEB)</b>.</p>
<div class="map-wrap">${mapHTML()}<div class="route-label" style="left:43%;top:39%">✈️ Colombo → Cebu</div><div class="plane" id="plane" style="left:21%;top:52%">✈️</div></div>
<div class="info-row"><div class="info">🛫 Start: Colombo CMB</div><div class="info">🛬 Destination: Cebu CEB</div><div class="info">🌏 International flight</div></div>
<div class="note" id="msg">Drag the plane toward the Cebu marker. ❤️</div></section>`);
dragPlane('plane','colombo');
}
function dragPlane(id,type){
const p=document.getElementById(id), map=document.getElementById('map');
let down=false;
p.onpointerdown=e=>{down=true;p.setPointerCapture(e.pointerId)};
p.onpointerup=()=>down=false;
p.onpointercancel=()=>down=false;
p.onpointermove=e=>{
if(!down)return;
const r=map.getBoundingClientRect();
let x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top)/r.height*100;
x=Math.max(3,Math.min(97,x));y=Math.max(5,Math.min(95,y));
p.style.left=x+'%';p.style.top=y+'%';
const tx=type==='colombo'?78:78, ty=72;
if(Math.hypot(x-tx,y-ty)<7){down=false;p.style.left=tx+'%';p.style.top=ty+'%';p.style.pointerEvents='none';
document.getElementById('msg').textContent=type==='colombo'?'🛬 Perfect! You landed at Cebu International Airport. 🌴❤️':'🛬 Angel has landed safely in Cebu! 💕';
addLove(type==='colombo'?15:15);
setTimeout(type==='colombo'?cebuWait:reunion,900)}
}
}
function cebuWait(){
hud(3);
screen(`<section><h2>🌴 You made it to Cebu!</h2><p class="story">Your plane has landed at <b>Mactan–Cebu International Airport</b>. You step out with your luggage… but Angel is still in Manila. 🥹</p>
<div class="airport-scene"><div class="terminal"><b>MACTAN–CEBU<br>INTERNATIONAL AIRPORT</b><div class="windows">▣ ▣ ▣ ▣</div></div><div class="stripe"></div><div style="position:absolute;right:12%;top:10%;font-size:45px">☀️</div><div style="position:absolute;right:23%;top:21%;font-size:42px">🌴</div><div style="position:absolute;right:7%;top:27%;font-size:40px">🌴</div><div class="person" style="left:47%">🧑🏻‍✈️</div></div>
<div class="center"><button class="btn" onclick="angelStart()">💗 Now Angel's turn</button></div></section>`);
}
function angelStart(){
hud(4);
screen(`<section><h2>🇵🇭 Manila → Cebu 💗</h2><p class="story">Angel is now at <b>Manila Ninoy Aquino International Airport (MNL)</b>. Help her fly south-east to Cebu. Drag her pink plane to the Cebu marker.</p>
<div class="map-wrap">${mapHTML()}<div class="route-label" style="left:72%;top:48%">💗 Manila → Cebu</div><div class="plane" id="angelPlane" style="left:69%;top:28%">💗✈️</div></div>
<div class="info-row"><div class="info">🛫 Angel starts: Manila MNL</div><div class="info">🛬 Angel arrives: Cebu CEB</div></div>
<div class="note" id="angelMsg">Drag Angel's plane down toward Cebu. 🥹</div></section>`);
dragPlane('angelPlane','angel');
}
function reunion(){
hud(5);
screen(`<section><h2>🥹 The moment we've been waiting for</h2><p class="story">Both flights have arrived in Cebu. You're at the airport. Angel is walking toward you. Find all five hearts to bring you together. ❤️</p>
<div class="airport-scene" id="scene"><div class="terminal"><b>WELCOME TO CEBU</b><div class="windows">▣ ▣ ▣ ▣</div></div><div class="stripe"></div>
<div class="person" id="me" style="left:25%">🧑🏻‍💼</div><div class="person" id="angel" style="right:22%">👩🏻‍🦰</div></div>
<div class="note" id="heartmsg">Tap all 5 hearts floating around the airport.</div></section>`);
const scene=document.getElementById('scene'), msg=document.getElementById('heartmsg');let found=0;
for(let i=0;i<5;i++){const h=document.createElement('div');h.className='heart';h.textContent=['💗','💕','💖','💞','❤️'][i];h.style.left=(32+Math.random()*40)+'%';h.style.top=(12+Math.random()*45)+'%';h.style.animationDelay=i*.15+'s';h.onclick=()=>{if(h.dataset.x)return;h.dataset.x=1;h.style.display='none';found++;addLove(3);msg.textContent=`${found}/5 hearts found 💕`;if(found===5){msg.textContent='All the hearts are leading you to Angel… 🥹';setTimeout(()=>{document.getElementById('me').style.left='47%';document.getElementById('angel').style.right='auto';document.getElementById('angel').style.left='54%';addLove(20);setTimeout(finale,1300)},500)}};scene.appendChild(h)}
}
function finale(){
hud(6);document.getElementById('progress').style.width='100%';
screen(`<section><div class="card"><div class="big">🫂❤️✈️</div><h3>We made it to Cebu!</h3>
<p class="story">You flew from <b>Colombo, Sri Lanka</b> to <b>Cebu, Philippines</b>. Angel flew from <b>Manila</b> to <b>Cebu</b>.</p>
<div class="ticket"><div>🇱🇰 CMB → CEB 🌴</div><div>🇵🇭 MNL → CEB 🌴</div><div>🥹 Final destination: Together</div></div>
<p class="story">One day, Rehan, this won't be just a game. You'll be holding the same luggage, walking through a real airport, and looking for Angel in Cebu. 💕</p>
<p style="font-size:18px;font-weight:800;color:#df4e78">Our future plan: <br>Two flights. One destination. One reunion. 🌏❤️</p>
<button class="btn" onclick="packing()">🔄 Fly our story again</button></div></section>`);
}
packing();
</script>
</body>
</html>
